services:
  - type: web
    name: terabox-resolver-api
    runtime: python
    region: singapore
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TERABOX_BASE_URL
        value: https://terabox.beer
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: 10000
